version: 2
updates:
  # Major versions stay out of the groups and arrive one pull request each, since they
  # usually need code changes. The default cooldown never delays a security update.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A major of the Stripe SDK pins a new API version and needs a manual migration.
    ignore:
      - dependency-name: stripe
        update-types: ["version-update:semver-major"]
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
