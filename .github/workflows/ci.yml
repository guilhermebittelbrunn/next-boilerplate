name: CI

on:
  pull_request:
  push:
    branches: [main]

# The jobs only check out the code, run the gates and upload artifacts, so they
# never need write access. Declaring it here also overrides whatever default the
# repository or the organization grants, which a fork does not inherit.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # No `version:` on purpose: the action reads `packageManager` from package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Must run after pnpm/action-setup, otherwise `cache: pnpm` cannot find pnpm.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The emulator suite (`test:emulator`) runs on the Firebase emulators, which refuse
      # any Java older than 21.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - run: pnpm install --frozen-lockfile

      # firebase.json is in the key because it decides which emulators run, and so which
      # JARs the cache has to hold: a hit on an older key would never store a new one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('pnpm-lock.yaml', 'firebase.json') }}

      - run: pnpm turbo run lint typecheck test test:emulator

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The release binary rather than gitleaks-action, which asks every
      # organization-owned repository for a license key. The checksum lives here, not in
      # the release, so a tampered release cannot vouch for itself.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      # Only the commits this change brings: the reference history already holds a key
      # flagged by secret scanning, and a full scan would fail every fork's first push.
      - name: Scan the new commits
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE..$HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="-1 $SHA"
          else
            range="$BEFORE..$SHA"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="$range" .

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Reads pnpm-lock.yaml only, no install. An exception goes in
      # pnpm.auditConfig.ignoreGhsas, justified with a revisit date under "//" in
      # package.json.
      - run: pnpm audit --prod --audit-level=high

  # Decides whether the browser suite and the coverage run are worth their minutes. A
  # skipped job reports success, so `e2e` can be a required check without holding a
  # documentation-only pull request forever.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      product: ${{ steps.scope.outputs.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # On a pull request the checkout is the merge commit, so HEAD^1 is the base tip.
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "product=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^1 HEAD | grep -qvE '^(docs/|specs/|\.claude/)|\.md$'; then
            echo "product=true" >> "$GITHUB_OUTPUT"
          else
            echo "product=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The Firebase emulators refuse any Java older than 21.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('pnpm-lock.yaml', 'firebase.json') }}

      - id: playwright-version
        run: echo "version=$(pnpm --filter e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      # The browser binary comes from the cache, but the system libraries it links
      # against do not survive between runners.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter e2e exec playwright install-deps chromium

      - run: pnpm e2e

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
            *-debug.log
          retention-days: 14

  coverage:
    name: coverage
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm coverage

      - run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage
          retention-days: 14
