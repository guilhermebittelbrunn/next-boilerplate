name: CI

on:
  pull_request:
  push:
    branches: [main]

# The jobs only check out the code, run the gates and upload artifacts, so they
# never need write access. Declaring it here also overrides whatever default the
# repository or the organization grants, which a fork does not inherit.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # No `version:` on purpose: the action reads `packageManager` from package.json.
      - uses: pnpm/action-setup@v6

      # Must run after pnpm/action-setup, otherwise `cache: pnpm` cannot find pnpm.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run lint typecheck test

  # Decides whether the browser suite and the coverage run are worth their minutes. A
  # skipped job reports success, so `e2e` can be a required check without holding a
  # documentation-only pull request forever.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      product: ${{ steps.scope.outputs.product }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # On a pull request the checkout is the merge commit, so HEAD^1 is the base tip.
      - id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "product=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^1 HEAD | grep -qvE '^(docs/|specs/|\.claude/)|\.md$'; then
            echo "product=true" >> "$GITHUB_OUTPUT"
          else
            echo "product=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The Firebase emulators refuse any Java older than 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}

      - id: playwright-version
        run: echo "version=$(pnpm --filter e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      # The browser binary comes from the cache, but the system libraries it links
      # against do not survive between runners.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter e2e exec playwright install-deps chromium

      - run: pnpm e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
            *-debug.log
          retention-days: 14

  coverage:
    name: coverage
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm coverage

      - run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          retention-days: 14
