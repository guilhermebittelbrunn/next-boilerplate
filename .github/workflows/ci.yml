name: CI

on:
  pull_request:
  push:
    branches: [main]

# The job only checks out the code and runs the gate, so it never needs write
# access. Declaring it here also overrides whatever default the repository or
# the organization grants, which a fork does not inherit.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # No `version:` on purpose: the action reads `packageManager` from package.json.
      - uses: pnpm/action-setup@v6

      # Must run after pnpm/action-setup, otherwise `cache: pnpm` cannot find pnpm.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run lint typecheck test
